# pnpm keeps its settings here rather than in package.json, in a
# single-package repo too.

# The global minimum release age holds a fresh publish back for a day, which is
# the right default for a dependency and the wrong one for a tool published from
# this machine: the release being waited out is the maintainer's own, and every
# repo here would sit a day behind a fix filed from one of them.
minimumReleaseAgeExclude:
  - charcheck
  - knip@6.45.1

# `@types/node` follows the oldest runtime the package claims, `engines.node`,
# rather than the Node 26 it is developed on: the types are what stop `src/`
# calling an API Node 24 lacks, before the oldest-supported job in CI would.
# `pnpm update --latest` would take it to the newest major and quietly drop that
# guard, so it is held out of that.
updateConfig:
  ignoreDependencies:
    - '@types/node'
