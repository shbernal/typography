name: Bug
description: Something else is broken
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or the few lines of code, and the input.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package version and Node version
      placeholder: '@shbernal/typography 0.1.0, node 22.11.0'
    validations:
      required: true
