name: New or changed rule
description: A typographic rule this should enforce and does not
labels: ['rule']
body:
  - type: markdown
    attributes:
      value: |
        Every rule carries a citation, which is what keeps a style from
        becoming a place where preferences collect unattributed. A shipped
        style's rules name the Imprimerie nationale, the RAE, the Duden or the
        Taalunie; `en` has no such body behind it and cites two manuals, and
        ships only what both of them say. Where the sources diverge, the rule
        reports without repairing or does not exist: that is why the serial
        comma is in no style here.

        A rule that is your own house's preference does not need this issue.
        Compose a style with the rule in it and cite the house style: that is
        what `compose`, `derive` and `@shbernal/typography/rules` are for.
  - type: input
    id: lang
    attributes:
      label: Style
      placeholder: en, fr, es, de-DE, de-CH, nl
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: What is wrong, and what correct looks like.
    validations:
      required: true
  - type: input
    id: citation
    attributes:
      label: Citation
      description: >
        The standards body and the section. If there is not one, say so: it may
        still be a house style worth documenting, but it will not become a rule.
    validations:
      required: true
  - type: dropdown
    id: fixable
    attributes:
      label: Can it be repaired unattended?
      description: >
        A rule whose repair needs information the pattern does not have ships
        with detection and no fix, and that is a normal outcome rather than an
        unfinished one.
      options:
        - 'Yes: one substitution, and applying it twice changes nothing'
        - 'No: repairing it needs a judgement or a parse'
        - Not sure
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: >
        Both directions, please. Text the rule should flag, and text that looks
        similar and must not be flagged. The second kind is the harder half and
        the one that decides whether the rule is shippable.
      render: text
    validations:
      required: true
