name: Corpus pins

# The other half of what used to be one `Corpus` workflow, and the half that is
# about this repository rather than about the web.
#
#   corpus-links.yml  do these URLs still resolve, and still extract?
#   this file         do the rules still measure what this repo records?
#
# Red here means the rules moved. Every number in gates/README.md and every count
# in `gates/findings-*.json` is a measurement of a fixed body of text, and the
# only way that pairing stays true is if the text is fixed and the measuring is
# re-run whenever the instrument changes. So this rebuilds from the archived
# captures named in `gates/sources/*.urls`, enforces `gates/documents-*.json`
# document by document, and then verifies the findings byte for byte.
#
# It runs on rule changes rather than on a schedule, which is the correction the
# split exists to make. A monthly reproduction check asks a question whose answer
# cannot change unless somebody commits something, and asks it against live text
# that changes on its own; every false alarm the old workflow produced was that
# mismatch. Reproducibility is a property of a commit, so it is checked per
# commit.
#
# The `paths` filter is deliberately wider than "the rules": the packs decide
# what is counted, `gates/corpora.json` decides which text is read and how it is
# extracted, the URL lists decide which documents and which captures, and both
# committed manifest families are the thing being verified. Any of them moving
# is a reason to re-measure. Over-including costs a run; under-including lets a
# baseline and its corpus drift apart between commits, which is the failure this
# whole file is here to prevent.
#
# `push` only, and on every branch rather than on `main` plus `pull_request`.
# This job asks somebody else's servers for 240 documents and waits six minutes
# doing it politely, so it runs once per push rather than once per push and again
# per pull request. CI proper is the workflow that runs both ways.
#
# It does not run the reproduction gate, which cannot run anywhere but the
# maintainer's machine. gates/README.md says why.

on:
  push:
    paths:
      - 'src/**'
      - 'gates/corpora.json'
      - 'gates/sources/**'
      - 'gates/documents-*.json'
      - 'gates/findings-*.json'
      - 'scripts/fetch-corpus.ts'
      - 'scripts/gate-findings.ts'
      - '.github/workflows/corpus-pins.yml'
  workflow_dispatch:
    # The same single-corpus input the link check carries, for the same reason: a
    # question about one corpus should not re-ask eight publishers and an archive
    # for 240 documents. The gates below are skipped for it, see there.
    inputs:
      corpus:
        description: One corpus id, e.g. theconversation-fr. Blank rebuilds all eight.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest

    # 99 of the 240 URLs have no usable capture and are still fetched from the
    # publisher, at the 1.5 s request rate with a retry ladder running to 90 s
    # per document, so this has the same long tail as the link check and the same
    # reason for a bound well above a healthy run. gates/README.md has the
    # coverage per corpus.
    timeout-minutes: 60

    steps:
      - name: Check out typography
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No `--live`, so every URL carrying a capture is read from it. That is
      # what makes this job's red mean something: a rebuild from fixed bytes that
      # disagrees with the pins is this repo's doing, and the same rebuild from
      # the live web could always have been a sub-editor.
      #
      # Both failures are red here, and the exit code says which. 1 is the build
      # coming back short, which for the archived documents means the archive is
      # having a bad day and for the rest means the same rot `corpus-links.yml`
      # exists to find. 3 is every document arriving and one of them not matching
      # `gates/documents-*.json`, which from captures means either a committed
      # timestamp points at bytes nobody verified or the extraction changed under
      # it. Neither is rebaselined here; `--rebaseline` is a person reading the
      # delta and committing it.
      #
      # `corpus` goes through the environment rather than into the script text,
      # because `${{ }}` substitutes before bash sees it and a dispatch input is
      # somebody's typing.
      - name: Rebuild every corpus from its captures
        env:
          ONLY: ${{ inputs.corpus }}
        run: node scripts/fetch-corpus.ts --refresh ${ONLY:+--only "$ONLY"}

      # The gate proper. Failing here means the corpora rebuilt to exactly the
      # text this repo pins and the *counts* over that text have moved, which
      # after the step above can only be the packs: a rule changed and the
      # committed baseline was not recut with it, or was recut wrongly.
      #
      # Both gates read all eight corpora and a targeted run built one, so they
      # would report the other seven absent and exit 1. That is a true statement
      # and useless output: it buries the per-document delta printed above under
      # seven lines of "you did not ask for this one". The gate belongs to the
      # full rebuild; a targeted run is an investigation, and what it is
      # investigating has already been printed by the time these would run.
      - name: Verify the committed findings against the rebuilt corpora
        if: ${{ !inputs.corpus }}
        run: node scripts/gate-findings.ts --verify

      - name: Say what was actually measured
        if: ${{ !inputs.corpus }}
        run: node scripts/gate-findings.ts
