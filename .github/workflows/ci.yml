name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back. Stated rather than inherited, because the
# repository default applies to a workflow that does not say, and a workflow that
# runs pull_request code is the wrong place to find out what the default is.
permissions:
  contents: read

jobs:
  check:
    # Both platforms. Nothing here spawns a process or touches a path, so the
    # platform risk is narrow and specific: this package's whole subject is
    # invisible characters, and a repo that normalises line endings wrongly on
    # one platform is exactly where U+00A0 and U+202F assertions would silently
    # start failing. `.gitattributes` pins that; this matrix is what proves it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out typography
        uses: actions/checkout@v5

      # Pinned to a commit rather than to `v5`, which is a moving tag a third
      # party can repoint. `actions/*` are GitHub's own and stay on tags; this is
      # the only action here from anyone else, and it runs in the same job that
      # publishes. Dependabot's `github-actions` ecosystem updates a pin like this
      # and puts the version in the PR, so the cost is a review rather than drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and check
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build
        run: pnpm build

  # `engines.node` claims >= 20, and the check job above cannot back that claim:
  # it runs the sources under Node's type stripping, which needs 24. So this job
  # builds `dist/` and exercises the built CLI on the oldest supported runtime.
  # Without it the engines field is an aspiration.
  oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - name: Check out typography
        uses: actions/checkout@v5

      # Pinned to a commit rather than to `v5`, which is a moving tag a third
      # party can repoint. `actions/*` are GitHub's own and stay on tags; this is
      # the only action here from anyone else, and it runs in the same job that
      # publishes. Dependabot's `github-actions` ecosystem updates a pin like this
      # and puts the version in the PR, so the cost is a review rather than drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.11.0

      - name: Set up Node 24 to build
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `package-manager-cache` defaults to true, which makes this step run
      # `pnpm store path` under the Node it just installed. pnpm 11 requires Node
      # 22.13, so on the one runtime this job exists to test, the setup step dies
      # before the smoke test it is setting up can run. Nothing is being installed
      # here - `dist/` was built two steps ago and the smoke test has no
      # dependencies - so there is no cache to want.
      - name: Set up Node 20 to run
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Smoke the built CLI on Node 20
        run: node scripts/smoke-dist.mjs
