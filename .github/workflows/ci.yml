name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back. Stated rather than inherited, because the
# repository default applies to a workflow that does not say, and a workflow that
# runs pull_request code is the wrong place to find out what the default is.
permissions:
  contents: read

# `prepare` installs the git hooks on every `pnpm install`, and installing them
# fetches the shared rules repo. A runner has no hooks to fire, so that is a
# network call this workflow otherwise does not need, on a job whose whole point
# is that `pnpm check` needs none. The hooks are a local pre-filter; the gate
# below is the same one they mirror.
env:
  LEFTHOOK: '0'

jobs:
  check:
    # Both platforms. Nothing here spawns a process or touches a path, so the
    # platform risk is narrow and specific: this package's whole subject is
    # invisible characters, and a repo that normalises line endings wrongly on
    # one platform is exactly where U+00A0 and U+202F assertions would silently
    # start failing. `.gitattributes` pins that; this matrix is what proves it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out typography
        uses: actions/checkout@v7

      # Pinned to a commit rather than to `v6`, which is a moving tag a third
      # party can repoint. `actions/*` are GitHub's own and stay on tags; this is
      # the only action here from anyone else, and it runs on every push and
      # pull request. Dependabot's `github-actions` ecosystem updates a pin like
      # this and puts the version in the PR, so the cost is a review rather than
      # drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version`: the action reads `packageManager` from package.json, which
        # is the one place the pnpm version is written.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and check
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build
        run: pnpm build

  # `engines.node` claims >= 22, and the check job above cannot back that claim:
  # it runs the sources under Node's type stripping, which needs 24. So this job
  # builds `dist/` and exercises the built CLI on the oldest supported runtime.
  # Without it the engines field is an aspiration.
  oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - name: Check out typography
        uses: actions/checkout@v7

      # Pinned to a commit rather than to `v6`, which is a moving tag a third
      # party can repoint. `actions/*` are GitHub's own and stay on tags; this is
      # the only action here from anyone else, and it runs on every push and
      # pull request. Dependabot's `github-actions` ecosystem updates a pin like
      # this and puts the version in the PR, so the cost is a review rather than
      # drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version`: the action reads `packageManager` from package.json, which
        # is the one place the pnpm version is written.

      - name: Set up Node 24 to build
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `package-manager-cache` defaults to true, which makes this step run
      # `pnpm store path` under the Node it just installed. Nothing is being
      # installed here - `dist/` was built two steps ago and the smoke test has no
      # dependencies - so there is no cache to want, and turning it off is what
      # keeps this step free to name any runtime the engines field admits. That
      # freedom is load-bearing rather than tidy: pnpm carries its own Node floor
      # (pnpm 11's was 22.13), so with the cache on, the runtime this job can
      # name would move with every pnpm bump instead of with `engines.node`.
      - name: Set up Node 22 to run
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Smoke the built CLI on Node 22
        run: node scripts/smoke-dist.mjs
