name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back. Stated rather than inherited, because the
# repository default applies to a workflow that does not say, and a workflow that
# runs pull_request code is the wrong place to find out what the default is.
permissions:
  contents: read

jobs:
  # Rules in `.github/cchk.toml`: commit messages carry no AI attribution. The
  # disclosure goes in the pull request description instead.
  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out typography
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check commit messages
        uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false

  check:
    # Both platforms. Nothing here spawns a process or touches a path, so the
    # platform risk is narrow and specific: this package's whole subject is
    # invisible characters, and a repo that normalises line endings wrongly on
    # one platform is exactly where U+00A0 and U+202F assertions would silently
    # start failing. `.gitattributes` pins that; this matrix is what proves it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out typography
        uses: actions/checkout@v7

      # Pinned to a commit rather than to `v6`, which is a moving tag a third
      # party can repoint. `actions/*` are GitHub's own and stay on tags; this is
      # the only action here from anyone else, and it runs on every push and
      # pull request. Dependabot's `github-actions` ecosystem updates a pin like
      # this and puts the version in the PR, so the cost is a review rather than
      # drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # No `version`: the action reads `packageManager` from package.json, which
        # is the one place the pnpm version is written.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and check
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build
        run: pnpm build

  # `engines.node` claims >= 24, and the check job above runs the Node in
  # `.nvmrc`, which is newer. So this job runs the gate, builds `dist/` and
  # exercises the built CLI on the oldest supported runtime. Without it the
  # engines field is an aspiration.
  oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - name: Check out typography
        uses: actions/checkout@v7

      # Pinned to a commit rather than to `v6`, which is a moving tag a third
      # party can repoint. `actions/*` are GitHub's own and stay on tags; this is
      # the only action here from anyone else, and it runs on every push and
      # pull request. Dependabot's `github-actions` ecosystem updates a pin like
      # this and puts the version in the PR, so the cost is a review rather than
      # drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # No `version`: the action reads `packageManager` from package.json, which
        # is the one place the pnpm version is written.

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install, check and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Smoke the built CLI
        run: node scripts/smoke-dist.mjs
