name: Publish

# Publishes to npm when a GitHub Release is published, using npm trusted
# publishing. There is no NPM_TOKEN in this repository and there should never be
# one: the registry authenticates the workflow itself over OIDC, and the tarball
# carries build provenance, so a package on npm can be traced back to the run and
# the commit that produced it.
#
# This needs a trusted publisher configured on the npm package, pointing at this
# repository and this file's name. npm matches on the filename, so renaming this
# file breaks publishing until the npm setting is renamed with it.
#
# The trigger is the Release rather than the tag it points at, so that pushing a
# tag is not on its own enough to publish: the release is a second, deliberate
# step, and it is the one a human takes after reading the tag. `workflow_dispatch`
# is the escape hatch for re-running a release that failed after the tag was
# already correct; dispatch it from the tag, not from a branch, or the tag check
# below will refuse it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - name: Check out typography
        uses: actions/checkout@v7

      # Pinned to a commit. This job holds an OIDC token that can publish to npm
      # under this package's name, so a third-party action resolved through a
      # moving tag is the one supply-chain step that matters here.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm, and the one bundled with Node is
      # not guaranteed to be recent enough.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tag is the only thing that says which version this is, and
      # package.json is the only thing that decides what gets published. A
      # release where they disagree is the one nobody notices until it is on the
      # registry. On a `release` event GITHUB_REF_NAME is the tag the release
      # points at, which is what this reads.
      - name: Refuse a tag that disagrees with package.json
        run: node scripts/check-release-tag.mjs

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Smoke the built CLI
        run: node scripts/smoke-dist.mjs

      - name: Publish
        run: npm publish --provenance --access public
