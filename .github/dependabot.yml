version: 2
updates:
  # Dev dependencies only, because there are no runtime ones and that is a
  # constraint rather than a coincidence. If Dependabot ever opens a PR under
  # "dependencies" here, something has gone wrong that is worth stopping for.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # `@types/node` stays on the major of `engines.node`, for the reason given
    # above `updateConfig` in pnpm-workspace.yaml. Dependabot does not read
    # that setting, so it is said again here, for majors only.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
